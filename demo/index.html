    <main id="demo">
      <noscript>
        <h1>Colourunder</h1>
        <p>
          An FFGL effect that records your clip the way a VHS deck does. The
          chroma is heterodyned down underneath the FM luma, so colour gets
          about 40 lines of resolution to luma's 234 and turns up late, to the
          right of every edge, with noise that comes out as blotches rather than
          grain. A playback phase error swings NTSC's hue, but PAL's alternating
          V axis and the 1H average turn the same error into nothing worse than
          faded saturation. The heads switch 6.5 lines before vertical sync and
          tear the bottom of the picture, a tracking bar sits in the vertical
          interval and walks up the frame as the error drifts, the dropout
          compensator patches holes with the line before, and a copy of a copy
          runs the whole chain again.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/colourunder">its repository</a>.
        </p>
